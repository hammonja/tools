{% extends "base.html" %}
{% block title %}Offline · Toolbox{% endblock %}
{% block content %}
<section class="empty-state">
  <span class="empty-icon">T</span>
  <h1>You’re offline</h1>
  <p>Adding, editing and analysing tools needs a connection. You can still browse your saved catalogue.</p>
  <a class="button button-primary" href="{{ url_for('index') }}">Open catalogue</a>
  <button class="button" type="button" onclick="location.reload()">Try again</button>
</section>
{% endblock %}
